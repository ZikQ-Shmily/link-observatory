services:
  manager:
    image: ${MANAGER_IMAGE:-ghcr.io/zikq-shmily/link-observatory:latest}
    restart: unless-stopped
    ports:
      - "${MANAGER_BIND_IP:-127.0.0.1}:${MANAGER_PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}"
      PUBLIC_URL: "${PUBLIC_URL:?Set PUBLIC_URL}"
      DATA_DIR: /data
      RELEASE_URL: "${RELEASE_URL:-}"
      INSTALL_SHA256: "${INSTALL_SHA256:-}"
    volumes:
      - monitor-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  monitor-data:
