name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0'
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}(-[A-Za-z0-9.-]+)?$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check installer and Go code
        run: |
          bash -n install-return.sh
          bash -n scripts/install.sh
          go test ./...
      - name: Build release assets
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "dist/link-probe-linux-$arch" ./cmd/agent
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/link-manager-linux-$arch" ./cmd/manager
          done
          amd64_sha=$(sha256sum dist/link-probe-linux-amd64)
          arm64_sha=$(sha256sum dist/link-probe-linux-arm64)
          bash scripts/package-install.sh "$RELEASE_TAG" "$GITHUB_REPOSITORY" \
            "${amd64_sha%% *}" "${arm64_sha%% *}" > dist/install.sh
          bash -n dist/install.sh
          grep -Fxq "installer_release_tag='$RELEASE_TAG'" dist/install.sh
          grep -Fxq "installer_sha_amd64='${amd64_sha%% *}'" dist/install.sh
          grep -Fxq "installer_sha_arm64='${arm64_sha%% *}'" dist/install.sh
      - name: Build Docker archives
        run: |
          docker buildx create --driver docker-container --use --name release-builder
          for arch in amd64 arm64; do
            archive="dist/link-manager-image-linux-$arch.tar"
            docker buildx build --platform "linux/$arch" --provenance=false \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "link-observatory:$RELEASE_TAG" --output "type=docker,dest=$archive" .
            gzip -n "$archive"
            docker load --input "$archive.gz"
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "link-observatory:$RELEASE_TAG")" == "linux/$arch" ]]
          done
      - name: Checksum all release assets
        run: |
          cd dist
          sha256sum install.sh link-probe-linux-* link-manager-linux-* link-manager-image-linux-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          release_flags=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${release_flags[@]}"
      - name: Publish manager container
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$RELEASE_TAG" .
          if [[ "$RELEASE_TAG" != *-* ]]; then
            latest_release=$(gh release view --json tagName --jq .tagName)
            if [[ "$latest_release" == "$RELEASE_TAG" ]]; then
              docker buildx imagetools create --tag "$image:latest" "$image:$RELEASE_TAG"
            fi
          fi
